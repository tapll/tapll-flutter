name: tapll
description: "Product analytics and crash reporting for Flutter apps, for the Tapll platform. A thin wrapper over the native Tapll iOS and Android SDKs."
version: 0.2.0
homepage: https://tapll.com
repository: https://github.com/tapll/tapll-flutter

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.tapll.tapll
        pluginClass: TapllPlugin
      ios:
        pluginClass: TapllPlugin
